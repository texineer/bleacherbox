services:
  yardbirds:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - yardbirds-data:/app/data
    environment:
      - NODE_ENV=production
      # Required — compose errors out if unset (no insecure default).
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      # Comma-separated list of allowed front-end origins for CORS.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Set once to seed the initial global admin; safe to leave unset afterwards.
      - GLOBAL_ADMIN_PASSWORD=${GLOBAL_ADMIN_PASSWORD:-}
      # OAuth client ID for "Continue with Google"; leave unset to disable.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped

volumes:
  yardbirds-data:
